repos:
  # Python: Ruff (replaces flake8 + isort + pyupgrade)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # JavaScript / JSX: Prettier
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [javascript, jsx, css, json]
        files: ^frontend/

  # General hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      # Blocks accidentally staged private keys
      - id: detect-private-key

  # Security: detect accidentally committed secrets (tokens, passwords, keys)
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  # Hard block: prevent any real .env file from ever being committed
  - repo: local
    hooks:
      - id: block-env-files
        name: Block .env files (secrets must never be committed)
        language: fail
        entry: >
          SECURITY: .env files must NEVER be committed to git.
          Use .env.example for templates and set real values as
          environment variables on Vercel / Render instead.
        files: '(^|/)(frontend|backend)?\.env$|(^|/)\.env\.(local|development|production|staging)$'
        exclude: '\.env\.example$'
